services:
  - type: web
    name: prediction-league
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn prediction_platform.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://prediction-league.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DATABASE_URL
        fromDatabase:
          name: prediction-league-db
          property: connectionString
      - key: FOOTBALL_API_KEY
        sync: false
      - key: CLOUDFLARE_ANALYTICS_TOKEN
        sync: false
      - key: PLAUSIBLE_DOMAIN
        sync: false

databases:
  - name: prediction-league-db
    plan: basic-256mb
