version: '3.8'

services:
  web:
    build: .
    container_name: prediction_league_web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-local-docker-production-secret-key-replace-in-env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/prediction_league
      - SPORTMONKS_API_TOKEN=${SPORTMONKS_API_TOKEN}
      - FOOTBALL_API_KEY=${FOOTBALL_API_KEY}
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: prediction_league_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prediction_league
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
