{% extends "base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
<section class="auth-card panel">
    <p class="eyebrow">Password help</p>
    <h1>Reset your password</h1>
    <p class="helper-text">Enter the email address linked to your account and we will send a reset link.</p>

    <form method="post" class="form-stack">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="primary-button" type="submit">Send reset link</button>
    </form>

    <p class="helper-text"><a href="{% url 'login' %}">Back to login</a></p>
</section>
{% endblock %}
